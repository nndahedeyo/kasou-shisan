:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

  --stamp:#C2382E; --stamp-soft:#F6E2DF; --indigo:#1F4E79; --indigo-soft:#E3ECF5;
  --good:#23704A; --good-soft:#E1F1E8; --warn:#9A6A10; --warn-soft:#F7EED9;
  --buy:#1E7A50; --sell:#C2382E;
  --display:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --stamp:#E2594C; --stamp-soft:#3A1F1C; --indigo:#7FAEDC; --indigo-soft:#1B2A3A;

:root[data-theme="dark"]{
  --paper:#10151B; --card:#171E26; --ink:#E5EBF0; --muted:#97A4B2; --line:#2A3440; --sunk:#0E1318;
  --stamp:#E2594C; --stamp-soft:#3A1F1C; --indigo:#7FAEDC; --indigo-soft:#1B2A3A;
  --good:#5BC28B; --good-soft:#163024; --warn:#E0B356; --warn-soft:#352A12; --buy:#5BC28B; --sell:#E2594C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0}
body::after{content:"仮";position:fixed;right:-2vw;bottom:-6vh;font-family:var(--display);font-size:46vh;line-height:1;color:var(--stamp);opacity:.05;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seal{width:50px;height:50px;border:3px solid var(--stamp);border-radius:50%;display:grid;place-items:center;color:var(--stamp);font-family:var(--display);font-size:27px;transform:rotate(-8deg);flex:none}
.brand h1{font-family:var(--display);font-size:25px;line-height:1.2;margin:0;letter-spacing:.04em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tools{margin-left:auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;font-weight:500}
button:hover{border-color:var(--indigo)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
button.primary{background:var(--indigo);border-color:var(--indigo);color:var(--card)}
button.buy{background:var(--buy);border-color:var(--buy);color:var(--card)}
button.sell{background:var(--sell);border-color:var(--sell);color:var(--card)}
button.danger{border-color:var(--stamp);color:var(--stamp)}
button.link{border:none;background:none;padding:0;color:var(--indigo);text-decoration:underline}
button:disabled{opacity:.45;cursor:not-allowed}
.notice{border:1.5px dashed var(--stamp);background:var(--stamp-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.notice b{color:var(--stamp)}
nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 12px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--stamp);font-weight:700}
section.view{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:22px;margin:0;line-height:1.35;text-wrap:balance}
h3{font-size:17px;margin:0;line-height:1.4}
p{margin:0}
.lead{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-width:760px}
ol.list li button{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 14px}
.num{font-family:var(--mono);color:var(--muted);font-size:14px}
.done-mark{font-size:13px;color:var(--good);font-weight:700;white-space:nowrap}
.todo-mark{font-size:13px;color:var(--muted);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lesson-body{display:flex;flex-direction:column;gap:10px;max-width:66ch}
.term{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:6px 14px;border-top:1px solid var(--line);padding-top:10px;margin:0}
.term dt{font-weight:700}
.term dd{margin:0;color:var(--muted)}
.quiz{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.choices{display:flex;flex-direction:column;gap:6px}
.choices button{text-align:left}
.choices button.right{border-color:var(--good);background:var(--good-soft)}
.choices button.wrong{border-color:var(--stamp);background:var(--stamp-soft)}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.ok{background:var(--good-soft)} .fb.ng{background:var(--stamp-soft)} .fb.info{background:var(--indigo-soft)} .fb.warn{background:var(--warn-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0;width:100%}
.coin{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px dashed var(--muted);font-family:var(--mono);font-size:9px;font-weight:500;position:relative;color:var(--ink);flex:none;background:var(--card)}
.coin::after{content:"仮";position:absolute;right:-6px;top:-6px;width:16px;height:16px;border-radius:50%;background:var(--stamp);color:#fff;font-family:var(--display);font-size:9px;display:grid;place-items:center}
.coin.BTC{border-color:var(--warn)} .coin.ETH{border-color:var(--indigo)} .coin.SOL{border-color:var(--good)} .coin.USDC{border-color:var(--muted)} .coin.JPY{border-color:var(--stamp)}

/* experience layout */
.exp{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.exp{grid-template-columns:minmax(0,1fr)}}
.guide{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
@media (max-width:880px){.guide{position:static}}
.stepper{display:flex;flex-direction:column;gap:4px;max-height:44vh;overflow:auto}
.stepper button{text-align:left;font-size:13px;padding:6px 10px;display:flex;gap:8px;align-items:center}
.stepper button.cur{border-color:var(--stamp);font-weight:700}
.stepper button .st{margin-left:auto;font-size:12px;color:var(--good)}
.todo{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.todo li.ok{color:var(--good);text-decoration:line-through}
.screen-wrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.switch{display:flex;gap:6px;flex-wrap:wrap}
.switch button{font-size:13px;padding:6px 12px}
.switch button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);min-width:0}
.browser .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.browser .dots{display:flex;gap:5px}.browser .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.browser .url{flex:1;min-width:0;font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site{padding:16px;display:flex;flex-direction:column;gap:14px;position:relative;min-height:420px}
.site-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.site-logo{font-weight:700;letter-spacing:.02em}
.site-logo b{color:var(--stamp)}
.subtabs{display:flex;gap:4px;flex-wrap:wrap}
.subtabs button{font-size:13px;padding:5px 10px;border-radius:999px}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.book{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.book td{padding:2px 6px;text-align:right}
.book tr.ask td:first-child{color:var(--sell)} .book tr.bid td:first-child{color:var(--buy)}
.book tr.mid td{text-align:center;font-weight:500;border-block:1px solid var(--line);padding:4px}
.book .barc{position:relative}
.book .barc i{position:absolute;right:0;top:2px;bottom:2px;opacity:.14}
.book tr.ask .barc i{background:var(--sell)} .book tr.bid .barc i{background:var(--buy)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.tbl td.r,.tbl th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:none;border-radius:0;padding:7px}
.seg button[aria-pressed="true"].b{background:var(--buy);color:var(--card)}
.seg button[aria-pressed="true"].s{background:var(--sell);color:var(--card)}
.seg button[aria-pressed="true"].n{background:var(--ink);color:var(--card)}
.phone{width:min(100%,380px);margin:0 auto;border:10px solid var(--ink);border-radius:34px;background:var(--card);overflow:hidden;position:relative;min-height:600px;display:flex;flex-direction:column}
.phone .status{display:flex;justify-content:space-between;font-size:12px;padding:6px 18px 2px;font-family:var(--mono)}
.app{padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.app-top{display:flex;align-items:center;gap:8px}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--sunk)}
.bigbal{font-size:30px;font-weight:700;text-align:center;font-family:var(--mono)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.actions button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:8px 2px;border-radius:12px}
.actions button span{font-size:18px;line-height:1}
.tok{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tok .v{margin-left:auto;text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap}
.tok .v small{display:block;color:var(--muted);font-size:12px}
.addr{font-family:var(--mono);font-size:12.5px;word-break:break-all;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.words span{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--sunk);font-family:var(--mono);font-size:13px}
.words span i{font-style:normal;color:var(--muted);font-size:11px;margin-right:5px}
.blur{filter:blur(7px);user-select:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 9px;font-family:var(--mono);font-size:13px}
.overlay{position:absolute;inset:0;background:rgba(10,15,20,.45);display:grid;place-items:center;padding:16px;z-index:5}
.popup{width:min(100%,360px);background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.popup .from{font-size:12px;color:var(--muted);font-family:var(--mono)}
.popup .ttl{font-size:17px;font-weight:700}
.qr{width:150px;height:150px;margin:0 auto;display:block}
.swapbox{max-width:420px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:8px}
.swapfield{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sunk);display:flex;flex-direction:column;gap:4px}
.swapfield .row input{border:none;background:none;font-size:22px;font-family:var(--mono);padding:0}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.fb,.popup{animation:fade .2s ease}}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>
</head>

function series(seed, start, vol){ const r = seeded(seed); const out = [start]; for (let i = 1; i < 30; i++) out.push(Math.round(out[i-1] * (1 + (r() - 0.48) * vol))); return out; }

function h32(str){ let h = 2166136261 >>> 0; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
function hexFrom(seed, n){ let h = h32(seed), out = ""; for (let i = 0; i < n; i++) { h = Math.imul(h ^ (h >>> 13), 2654435761) >>> 0; out += "0123456789abcdef"[h % 16]; } return out; }

async function makeWords(){
  const rnd = new Uint32Array(12); crypto.getRandomValues(rnd);
  const idx = Array.from(rnd, v => v % 2048);
  try { /* make the checksum deliberately wrong so these words never open a real wallet */
    const bits = idx.map(i => i.toString(2).padStart(11, "0")).join("");
    const ent = new Uint8Array(16); for (let i = 0; i < 16; i++) ent[i] = parseInt(bits.slice(i * 8, i * 8 + 8), 2);
    const hsh = new Uint8Array(await crypto.subtle.digest("SHA-256", ent));
    const want = hsh[0] >> 4, have = parseInt(bits.slice(128), 2);
    if (want === have) idx[11] = (idx[11] & ~15) | ((have + 1) & 15);
  } catch (e) { idx[11] = (idx[11] + 1) % 2048; }
  return idx.map(i => WL[i]);
}

  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9); if (!inF && r() > 0.52) cells += `<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}"/>`; }
  return `<svg class="qr" viewBox="0 0 ${n*s} ${n*s}" role="img" aria-label="${tx("アドレスのQRコード（練習用の見本）","Address QR code (practice sample)")}"><rect width="${n*s}" height="${n*s}" fill="var(--card)"/><g fill="var(--ink)">${cells}</g>${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`; }

function coinPick(){ return `<div class="subtabs">${["BTC","ETH","SOL"].map(c => `<button type="button" data-coin="${c}" aria-pressed="${S.coin === c}">${coin(c)} ${cn(c)}</button>`).join("")}</div>`; }
function chart(c){
  const px = C[c].px.slice(); px[29] = Math.round(mid(c));
  const lo = Math.min(...px), hi = Math.max(...px), W = 600, H = 140, pad = 8;
  const X = i => pad + i * (W - 2 * pad) / 29, Y = v => H - pad - (v - lo) / (hi - lo || 1) * (H - 2 * pad);
  const d = px.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join("");
  const area = d + `L${X(29)} ${H - pad}L${X(0)} ${H - pad}Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 18}" role="img" aria-label="${tx("過去30日の値動き","Last 30 days")}">
    <line x1="${pad}" x2="${W - pad}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)" stroke-dasharray="3 4"/><line x1="${pad}" x2="${W - pad}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${area}" fill="var(--indigo)" fill-opacity=".08"/><path d="${d}" fill="none" stroke="var(--indigo)" stroke-width="2"/>
    <circle cx="${X(29)}" cy="${Y(px[29])}" r="4" fill="var(--stamp)"/>
    <text x="${W - pad}" y="${Y(hi) - 4}" font-size="11" fill="var(--muted)" text-anchor="end">${yen(hi)}</text><text x="${W - pad}" y="${Y(lo) + 12}" font-size="11" fill="var(--muted)" text-anchor="end">${yen(lo)}</text>
    <text x="${pad}" y="${H + 14}" font-size="11" fill="var(--muted)">${tx("30日前","30 days ago")}</text><text x="${W - pad}" y="${H + 14}" font-size="11" fill="var(--muted)" text-anchor="end">${tx("今","Now")}</text></svg>
    <p class="small">${REAL ? tx(`本物の${c}の値動きを写しています（CoinGecko、${REAL}時点）。${cn(c)}は本物ではありません。`, `Copies the real ${c} price (CoinGecko, as of ${REAL}). ${cn(c)} is not real.`) : tx("見本の値動きです。実際の価格ではありません。","A sample line, not the real price.")}</p>`;
}

function bookRows(c){
  const m = mid(c), r = seeded(h32(c + S.tick)); const tick = c === "BTC" ? 1000 : c === "ETH" ? 50 : 5;
  const base = Math.round(m / tick) * tick; const asks = [], bids = [];
  for (let i = 1; i <= 7; i++) { asks.push([base + tick * i, +(r() * 2 + .1).toFixed(3)]); bids.push([base - tick * (i - 1), +(r() * 2 + .1).toFixed(3)]); }
  return {asks, bids, tick, base};
}

/* ---------- events ---------- */
function bind(){
  const on = (sel, fn, ev = "onclick") => document.querySelectorAll(sel).forEach(b => b[ev] = () => fn(b));
  on("[data-lesson]", b => { S.lesson = b.dataset.lesson; save(); render(); window.scrollTo(0, 0); });
  on("[data-back]", () => { S.lesson = null; save(); render(); });
  on("[data-go]", b => { S.view = b.dataset.go; S.lesson = null; save(); render(); window.scrollTo(0, 0); });
  on("[data-ans]", b => { const id = S.lesson, l = L.find(x => x.id === id), c = J() ? l.ja : l.en, k = +b.dataset.ans; S.quiz[id] = k; if (k === c.a) S.lessons[id] = true; save(); render(); });
  on("[data-retry]", () => { delete S.quiz[S.lesson]; save(); render(); });
  on("[data-step]", b => { S.step = +b.dataset.step; S.scr = STEPS[S.step-1].scr; pop = null; save(); render(); });
  on("[data-scr]", b => { S.scr = b.dataset.scr; pop = null; save(); render(); });
  on("[data-mode]", b => { S.mode = b.dataset.mode; save(); render(); });
  on("[data-coin]", b => { S.coin = b.dataset.coin; save(); render(); });
  on("[data-side]", b => { S.side = b.dataset.side; save(); render(); });
  on("[data-otype]", b => { S.otype = b.dataset.otype; save(); render(); });
  on("[data-cancel]", b => { const o = S.orders.find(x => x.id === +b.dataset.cancel); if (o) { o.st = "cancel"; if (o.side === "buy") S.jpy += o.p * o.qty; else S.exb[o.c] += o.qty; } save(); render(); });
  on("[data-wscr]", b => { S.wscr = b.dataset.wscr; if (b.dataset.wscr === "send") S.sendDraft = {tok:"ETH", amt:"0.01"}; save(); render(); });
  on("[data-wtab]", b => { S.wtab = b.dataset.wtab; save(); render(); });
  on("[data-fill]", b => { const w = S.wal; w.fill = w.fill || {}; const k = w.ask.find(i => !w.fill[i]); if (k !== undefined) w.fill[k] = b.dataset.fill; save(); render(); });
  on("[data-sig]", b => { S.sig = S.sig || {}; S.sig[b.dataset.sig] = b.dataset.v; if (S.sig.a === "ok" && S.sig.b === "no" && S.sig.c === "no") markT(9, 0); save(); render(); });
  on("[data-fake]", b => { S.fake = b.dataset.fake; if (S.fake === "y") markT(9, 1); save(); render(); });
  on("[data-pop]", b => popAnswer(b.dataset.pop === "yes"));
  on("[data-act]", b => act(b.dataset.act, b));
  document.querySelectorAll("[data-inh]").forEach(b => b.onchange = () => { S.inh[b.dataset.inh] = b.checked; if (["where","list","howto"].every(k => S.inh[k])) markT(11, 0); save(); render(); });
  const sw = $("#sw"); if (sw) sw.onchange = () => { S.swapAmt = sw.value; save(); render(); };
}
const msg = (k, ja, en) => { flash = {k, m:tx(ja, en)}; };
const gmsg = (k, ja, en) => { gflash = {k, m:tx(ja, en)}; };
const addAct = (ja, en, st) => { S.wal.acts = S.wal.acts || []; S.wal.acts.push({ja, en, st}); };

async function act(a, b){
  const w = S.wal;
  /* exchange account */
  if (a === "signup") { if (($("#pw").value || "").length < 8) msg("ng", "パスワードは8文字以上にしてください。", "Use at least 8 characters."); else { S.acct = {email:$("#em").value}; markT(1, 0); } }
  if (a === "kyc") { S.acct.kyc = true; markT(1, 1); msg("ok", "本人確認が終わりました（練習なので、すぐ承認されます）。", "Verified (instantly, since this is practice)."); }

    else msg("ng", "コードが違います。認証アプリに表示されている6桁を入れてください。", "Wrong code. Enter the 6 digits shown in the authenticator."); }

  /* dealer desk */
  if (a === "otcbuy" || a === "otcsell") { const c = S.coin, amt = Math.floor(+$("#otcamt").value || 0), m = mid(c);
    if (a === "otcbuy") { if (amt < 1000) msg("ng", "1,000仮円以上を入れてください。", "Enter at least 1,000."); else if (amt > S.jpy) msg("ng", "仮円が足りません。先に入金してください。", "Not enough Kari-yen. Deposit first.");
      else { const qty = amt / (m * 1.02); S.jpy -= amt; S.exb[c] += qty; markT(3, 0); if (c === "ETH") markT(3, 1);
        msg("ok", `${q(qty, c)} ${cn(c)}を、1枚あたり${yen(m * 1.02)}仮円で買いました。今すぐ売ると1枚${yen(m * 0.98)}仮円です。この差が販売所の実質の手数料です。`, `Bought ${q(qty, c)} ${cn(c)} at ${yen(m * 1.02)} each. Selling right now gives ${yen(m * 0.98)} each. That gap is the dealer desk's real fee.`); } }
    else { const qty = amt / (m * 0.98); if (qty > S.exb[c] + 1e-12) msg("ng", "売る分の残高が足りません。", "Not enough to sell."); else { S.exb[c] -= qty; S.jpy += amt; msg("ok", `${q(qty, c)} ${cn(c)}を売りました。`, `Sold ${q(qty, c)} ${cn(c)}.`); } } }

      else if (S.side === "sell" && qty > S.exb[c] + 1e-12) msg("ng", "売る分の残高が足りません。", "Not enough to sell.");

        S.fills.push({c, side:S.side, p, qty, fee, how:tx("成行","market")}); markT(4, 0); msg("ok", `成行で、板の一番よい値段（${yen(p)}）ですぐに約定しました。`, `Market order filled right away at the best price on the book (${yen(p)}).`); } }
    else { const p = +$("#lp").value;

    else { w.fill = {}; msg("ng", "合っていません。書き写した紙を見直してください。本物でここを間違えると、復元できません。", "That doesn't match. Re-check your paper. Get this wrong for real and you can't restore."); } }
  if (a === "copyaddr" || a === "copyfull") { S.copied = w.addr; markT(6, 0); try { await navigator.clipboard.writeText(w.addr); } catch (e) {} msg("ok", "アドレスをコピーしました。", "Address copied."); }
  if (a === "confirmpending") { (w.acts || []).forEach(x => { if (x.st === "pending") x.st = "done"; }); if ((S.wds || []).some(x => x.st === "done")) markT(6, 2); msg("ok", "ネットワークで承認されました。", "Confirmed on the network."); }
  if (a === "pastefriend") { $("#st").value = S.friend; return; }
  if (a === "sendnext") { const to = $("#st").value.trim(), tok = $("#stok").value, amt = +$("#sa").value;
    S.sendDraft = {to, tok, amt:$("#sa").value};
    if (!/^0x[0-9a-f]{40}$/.test(to)) msg("ng", "アドレスの形が正しくありません。", "That address isn't valid.");
    else if (!(amt > 0) || amt > (w.bal[tok] || 0) + 1e-12) msg("ng", "残高が足りません。", "Not enough balance.");
    else if ((w.bal.ETH || 0) < 0.0004 + (tok === "ETH" ? amt : 0)) msg("ng", `ネットワーク手数料を払う${cn("ETH")}が足りません。イーサリアムでは、何を送るときも手数料は${cn("ETH")}で払います。`, `Not enough ${cn("ETH")} for the network fee. On Ethereum, every transfer pays its fee in ${cn("ETH")}.`);
    else S.sendDraft.confirm = true; }
  if (a === "sendback") { S.sendDraft.confirm = false; }
  if (a === "sendgo") { const sd = S.sendDraft; w.bal[sd.tok] -= +sd.amt; w.bal.ETH -= 0.0004; addAct(`送金 ${q(sd.amt, sd.tok)} ${cn(sd.tok)} → ${short(sd.to)}`, `Sent ${q(sd.amt, sd.tok)} ${cn(sd.tok)} → ${short(sd.to)}`, "pending");
    if (sd.to === S.friend) { markT(7, 0); markT(7, 1); } S.sendDraft = null; S.wscr = "home"; S.wtab = "act";
    msg("ok", "送りました。アクティビティに「確認中」と出ています。", "Sent. It shows as Confirming under Activity."); }
  if (a === "toswap") { S.scr = "dex"; }
  if (a === "lose") { S.lost = true; S.restoring = false; S.wscr = "home"; markT(10, 0); }
  if (a === "wrestore") { S.restoring = true; }
  if (a === "restorecancel") { S.restoring = false; }
  if (a === "restorego") { const typed = $("#rw").value.trim().toLowerCase().split(/\s+/);
    if (w && typed.join(" ") === w.words.join(" ")) { S.lost = false; S.restoring = false; markT(10, 1); msg("ok", "元に戻りました。残高もそのままです。資産はスマホではなく台帳の上にあり、英単語があれば戻せます。", "Restored, balances intact. The assets live on the ledger, not the phone, and the words bring them back."); }
    else msg("ng", "英単語か順番が違います。本物では、1つでも違うと、別の空のウォレットが開いてしまいます。", "Wrong word or order. For real, one wrong word opens a different, empty wallet."); }
  if (a === "lostpaper") { msg("ng", "本番なら、鍵をなくしたことになり、資産は二度と戻りません。問い合わせる窓口はありません。練習なので、英単語を表示します：" + (w ? w.words.join(" ") : ""), "For real, the key is gone and so are the assets, with no desk to ask. Since this is practice, here are your words: " + (w ? w.words.join(" ") : "")); }
  /* DEX */
  if (a === "connect") { if (!w || !w.backed || S.lost) msg("ng", "先にウォレットを作ってください（段階5）。", "Create your wallet first (step 5)."); else pop = {kind:"connect"}; }
  if (a === "flip") { S.dex.from = S.dex.from === "ETH" ? "USDC" : "ETH"; S.swapAmt = S.dex.from === "ETH" ? 0.02 : Math.max(1, Math.floor((w && w.bal.USDC) || 0)); }
  if (a === "askallow") { pop = {kind:"allow", amt:+(S.swapAmt || 30)}; }
  if (a === "swap") { const from = S.dex.from, to = from === "ETH" ? "USDC" : "ETH", amt = +(S.swapAmt || (from === "ETH" ? 0.02 : 30)), rate = mid("ETH") / USDC_YEN;
    const out = (from === "ETH" ? amt * rate : amt / rate) * 0.997;
    if (!(amt > 0) || amt > (w.bal[from] || 0) + 1e-12) msg("ng", "残高が足りません。", "Not enough balance.");
    else if ((w.bal.ETH || 0) < 0.0006 + (from === "ETH" ? amt : 0)) msg("ng", `ネットワーク手数料の${cn("ETH")}が足りません。`, `Not enough ${cn("ETH")} for the network fee.`);
    else pop = {kind:"swap", from, to, amt, out, min:out * 0.995}; }
  if (a === "sigreset") { S.sig = {}; }
  if (a === "fakereset") { S.fake = null; }
  /* misc */
  if (a === "askreset") { S.confirmReset = true; }
  if (a === "cancelreset") { S.confirmReset = false; }
  if (a === "reset") { const lang = S.lang; S = blank(); S.lang = lang; S.view = "progress"; pop = null; }
  save(); render();
}
function popAnswer(yes){
  const p = pop, w = S.wal; pop = null;
  if (p.kind === "connect") { if (yes) { S.dex.conn = true; markT(8, 0); msg("ok", "接続しました。サイトはあなたのアドレスと残高を見られますが、お金を動かすには毎回あなたの確定が必要です。", "Connected. The site can see your address and balances, but moving money always needs your confirmation."); } }
  if (p.kind === "allow") { if (yes) { const cap = $("#capsel") ? $("#capsel").value : "exact";
    if (cap === "max") { S.dex.allow = 1e12; msg("warn", "上限なしで許可しました。本物では、このサイトが乗っ取られると、あなたのUSDCを全部動かせてしまいます。許可は、取引に必要な分だけにするのが安全です。練習なので、この許可は取り消しておきます。もう一度、必要な分だけで許可してください。", "You allowed unlimited use. For real, if this site were hacked, all your USDC could be taken. Allow only what the trade needs. Since this is practice, the permission has been revoked; try again with only what's needed."); S.dex.allow = 0; }
    else { S.dex.allow = p.amt; S.allowedExact = true; addAct(`使用の許可 ${q(p.amt, "USDC")} 仮USDC`, `Allowed ${q(p.amt, "USDC")} Kari-USDC`, "done"); w.bal.ETH -= 0.0002; msg("ok", "この取引に必要な分だけを許可しました。次に「交換する」を押します。", "Allowed exactly what this trade needs. Now press Swap."); } } }
  if (p.kind === "swap") { if (yes) { w.bal[p.from] -= p.amt; w.bal[p.to] = (w.bal[p.to] || 0) + p.out; w.bal.ETH -= 0.0006; if (p.from === "USDC") S.dex.allow = Math.max(0, S.dex.allow - p.amt);
    addAct(`交換 ${q(p.amt, p.from)} ${cn(p.from)} → ${q(p.out, p.to)} ${cn(p.to)}`, `Swapped ${q(p.amt, p.from)} ${cn(p.from)} → ${q(p.out, p.to)} ${cn(p.to)}`, "done");
    if (p.from === "ETH") markT(8, 1); if (p.from === "USDC" && S.allowedExact) markT(8, 2);
    msg("ok", `交換しました。${q(p.out, p.to)} ${cn(p.to)}がウォレットに入りました。`, `Swapped. ${q(p.out, p.to)} ${cn(p.to)} is now in your wallet.`); }
    else msg("info", "拒否しました。お金は動いていません。", "Rejected. No money moved."); }
  save(); render();
}

document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { S.view = b.dataset.view; S.lesson = null; save(); render(); window.scrollTo(0, 0); });
$("#lang").onclick = () => { S.lang = J() ? "en" : "ja"; save(); render(); };
render();
fetch("prices.json", {cache:"no-store"}).then(r => r.ok ? r.json() : null).then(d => {
  if (!d || !d.coins) return;
  for (const c of Object.keys(C)) { const p = d.coins[c]; if (!(Array.isArray(p) && p.length >= 30 && p.every(v => v > 0))) return; }
  for (const c of Object.keys(C)) C[c].px = d.coins[c].slice(-30).map(Math.round);
  REAL = String(d.as_of || "").slice(0, 10); render();
}).catch(() => {});
})();
</script>
