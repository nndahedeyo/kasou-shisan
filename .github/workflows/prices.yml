name: prices

# 毎日、本物の値動き（CoinGecko）を prices.json に写す。リポジトリが動き続けるので、定期実行も止まらない。
on:
  schedule:
    - cron: "41 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4（番号で固定）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5（番号で固定）
        with:
          python-version: "3.12"
      - run: python scripts/fetch_prices.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898269+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "値動きを更新" || exit 0
          git push
